<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hyperbola</title>
    <style>
        html,body{
            margin:0;
            height:100%;
            background:#000;
        }
        body{
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }
        canvas{
            max-width:100%;
            max-height:100%;
            aspect-ratio:16/9;
            background:#000;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <script>
        const canvas=document.getElementById('canvas');
        const mouse={x:0.5,y:0.5}
        canvas.addEventListener('mousemove',(e)=>{
            const r=canvas.getBoundingClientRect();
            mouse.x=(e.clientX-r.left)/r.width;
            mouse.y=(e.clientY-r.top)/r.height;
        });
        const ctx=canvas.getContext('2d');
        const columns=320;
        const total_cells=60000;
        const cell_width=6;
        const cell_height=7;
        function draw(time){
            canvas.width=canvas.width;
            const mx=mouse.x*10.67;
            const my=mouse.y*6.5-3;
            for(let i=total_cells-1;i>=0;i--){
                const px=(i%columns)*cell_width;
                const py=i/54-5;
                const a=(i%columns)/30;
                const b=i/9000-3;
                const dist=Math.hypot(a-mx,b-my);
                const field=Math.sin(a*a-b*b)+(a*b+Math.cos(a-time)*20)-Math.sin(4*b)+6*Math.sin(dist*5-time*4)/(1+dist*dist);
               const d=40/(field*field);
               const red=d;
               const green=d/9;
               const blue=Math.pow(d+5,b);
               ctx.fillStyle=`rgba(${Math.floor(green)},${Math.floor(red)},${Math.floor(blue)},0.5)`;
               ctx.fillRect(px,py,cell_width,cell_height);
            }
        }
        const startTime=performance.now();
        function loop(){
            draw((performance.now()-startTime)/1000);
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
